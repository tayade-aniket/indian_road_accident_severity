name: Keep Streamlit App Awake

# ─────────────────────────────────────────────────────────────────────────────
# Runs automatically every 10 minutes on GitHub's cloud runners.
# Purpose: Ping the hosted Streamlit app so Streamlit Cloud never marks it
# as inactive and never puts it to sleep.
#
# ZERO LATENCY & ZERO IMPACT ON APP:
#   1. Runs 100% externally on GitHub's servers — not inside your app.
#   2. Targets Streamlit's official lightweight healthcheck: /_stcore/health
#      - Responds in ~1ms with HTTP 200 "ok".
#      - Does NOT execute app.py or pandas/ML inference.
#      - Does NOT consume server RAM or CPU.
#      - Ingress router registers active HTTP traffic, resetting the 7-day sleep timer!
#   3. Includes automatic fallback to root URL (/) if health endpoint is proxied.
#   4. Automatically prevents GitHub from suspending the cron after 60 days.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '*/10 * * * *'    # Every 10 minutes — ideal keep-alive cadence
  workflow_dispatch:          # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep_awake:
    name: Ping & Keep-Alive Streamlit App
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: keep-awake-ping
      cancel-in-progress: true

    steps:
      - name: Checkout repository (for keepalive guard)
        uses: actions/checkout@v4

      - name: Resolve target URL
        run: |
          TARGET="${{ secrets.APP_URL }}"
          if [ -z "$TARGET" ]; then
            TARGET="https://indian-road-accident-severity.streamlit.app"
            echo "INFO: APP_URL secret not set — using default target: $TARGET"
          fi
          HEALTH="${TARGET%/}/_stcore/health"
          echo "TARGET_URL=$TARGET" >> "$GITHUB_ENV"
          echo "HEALTH_URL=$HEALTH" >> "$GITHUB_ENV"
          echo "Target App URL : $TARGET"
          echo "Health Endpoint: $HEALTH"

      - name: Ping Health Endpoint (Zero-Impact Heartbeat)
        id: ping_health
        run: |
          echo "Pinging health endpoint at $(date -u '+%Y-%m-%d %H:%M:%S UTC')..."
          HTTP=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --location \
            --max-redirs 5 \
            --max-time 15 \
            --retry 2 \
            --retry-delay 3 \
            --retry-connrefused \
            --user-agent "GitHub-KeepAwake-Bot/4.0 (Streamlit-HealthCheck)" \
            "$HEALTH_URL" || echo "000")
          echo "HTTP_HEALTH=$HTTP" >> "$GITHUB_ENV"
          echo "  -> /_stcore/health responded with: HTTP $HTTP"

      - name: Fallback Ping to Root (If Health Check is Unreachable)
        if: env.HTTP_HEALTH != '200'
        run: |
          echo "Health endpoint returned $HTTP_HEALTH. Falling back to root URL..."
          sleep 10
          HTTP_ROOT=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --location \
            --max-redirs 5 \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            --user-agent "GitHub-KeepAwake-Bot/4.0 (Streamlit-RootFallback)" \
            "$TARGET_URL" || echo "000")
          echo "HTTP_ROOT=$HTTP_ROOT" >> "$GITHUB_ENV"
          echo "  -> Root URL responded with: HTTP $HTTP_ROOT"

      - name: Keep-Awake Audit Report
        run: |
          echo "================================================="
          echo "  Streamlit Cloud Keep-Awake Report"
          echo "  Target App : $TARGET_URL"
          echo "  Health URL : $HEALTH_URL (HTTP $HTTP_HEALTH)"
          if [ -n "$HTTP_ROOT" ]; then
            echo "  Root URL   : $TARGET_URL (HTTP $HTTP_ROOT)"
          fi
          echo "================================================="
          if [ "$HTTP_HEALTH" = "200" ]; then
            echo "SUCCESS: App is online and active! Inactivity timer reset."
          elif [ "$HTTP_ROOT" -ge 200 ] 2>/dev/null && [ "$HTTP_ROOT" -lt 400 ] 2>/dev/null; then
            echo "SUCCESS: App responded on root URL (HTTP $HTTP_ROOT)."
          else
            echo "NOTICE: App may be in cold boot or restarting. Next ping in 10m."
          fi

      - name: Prevent GitHub from suspending scheduled workflow (60-day rule)
        uses: gautamkrishnar/keepalive-workflow@v1
        continue-on-error: true
        with:
          committer_email: "actions@github.com"
          committer_username: "github-actions[bot]"
