name: Keep Streamlit App Awake

# ─────────────────────────────────────────────────────────────────────────────
# Runs automatically every 10 minutes on GitHub's cloud runners.
# Purpose: Ping the hosted Streamlit app so Streamlit Community Cloud
# never marks it as inactive and never puts it to sleep.
#
# ZERO LATENCY & ZERO IMPACT ON APP:
#   1. Runs 100% externally on GitHub's cloud — zero load on your machine.
#   2. Targets Streamlit's official healthcheck: /_stcore/health (<1ms, 200 OK).
#   3. Does NOT load data, run ML inference, or consume server memory.
#   4. Graceful fallback to root URL if health endpoint is proxied.
#   5. Automatically keeps GitHub Actions schedule active past 60 days.
# ─────────────────────────────────────────────────────────────────────────────

'on':
  schedule:
    - cron: '*/10 * * * *'    # Every 10 minutes
  workflow_dispatch:          # Allows manual run from Actions tab anytime

jobs:
  keep_awake:
    name: Ping Streamlit App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping Streamlit Cloud & Keep Awake
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          TARGET="${APP_URL:-https://indian-road-accident-severity.streamlit.app}"
          # Strip trailing slashes
          TARGET="${TARGET%/}"
          HEALTH_URL="${TARGET}/_stcore/health"

          echo "Target App : $TARGET"
          echo "Health URL : $HEALTH_URL"
          echo "Timestamp  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # Ping official health endpoint (fast <1ms response, 200 OK)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -L "$HEALTH_URL" 2>/dev/null || echo "000")
          echo "Health endpoint response: HTTP $STATUS"

          # Fallback to root URL if health check is unreachable or not 200
          if [ "$STATUS" != "200" ]; then
            echo "Health endpoint returned HTTP $STATUS. Pinging root URL: $TARGET"
            sleep 5
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -L "$TARGET" 2>/dev/null || echo "000")
            echo "Root URL response: HTTP $STATUS"
          fi

          # Report status without failing the cron job
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "304" ]; then
            echo "SUCCESS: Streamlit app is awake and responsive (HTTP $STATUS)!"
          else
            echo "NOTICE: App returned HTTP $STATUS. App may be cold-booting. Next ping in 10 minutes."
          fi

      - name: Keep GitHub Actions schedule active (60-day inactivity rule)
        uses: gautamkrishnar/keepalive-workflow@v2
        continue-on-error: true
